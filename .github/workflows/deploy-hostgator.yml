# Publica el sitio en HostGator (finezzainteriores.com) por FTP.
# - Cada push a main sube a producción solo los archivos que cambiaron.
# - "Run workflow" permite volver a publicar una versión anterior (tag v1.0.0, v1.1.0, ...).
name: Deploy a HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (tag, p. ej. v1.0.0). Vacío = última de main"
        required: false
        default: ""

concurrency:
  group: deploy-hostgator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar credenciales FTP
        id: check
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "Faltan los secrets FTP_HOST / FTP_USERNAME / FTP_PASSWORD; no se publica."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Subir a HostGator
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.pdf
            **/*.bat
            **/.DS_Store
            **/README.md
